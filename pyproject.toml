[project]
name = "maas-bird-development"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["maas-bird-common"]

[tool.uv.sources]
maas-bird-common = { path = "shared", editable = true }

[dependency-groups]
dev = ["ops[testing]~=3.7", "pytest>=8,<10", "pytest-cov>=6", "ruff>=0.12", "jubilant>=1.8,<2", "pytest-jubilant>=2,<3", "jsonschema>=4"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "-ra"
markers = ["integration: requires an isolated Juju model and packed charms"]

[tool.ruff]
line-length = 99
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
