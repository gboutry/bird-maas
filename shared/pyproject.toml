[project]
name = "maas-bird-common"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "ops~=3.7",
    "pydantic>=2.10,<3",
    "requests>=2.32,<3",
    "requests-oauthlib>=2,<3",
    "PyYAML>=6,<7",
    "charmlibs-apt>=1,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maas_bird"]
