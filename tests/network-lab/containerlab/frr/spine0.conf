hostname spine0
frr defaults traditional
service integrated-vtysh-config
ip forwarding
interface lo
 ip address 10.205.250.1/32
exit
interface eth1
 ip address 10.205.200.0/31
exit
interface eth2
 ip address 10.205.200.4/31
exit
interface eth3
 ip address 10.205.200.8/31
exit
interface eth4
 ip address 10.205.200.12/31
exit
ip prefix-list LAB-LOOPBACKS seq 10 permit 10.205.250.0/24 ge 32 le 32
route-map LAB-LOOPBACKS permit 10
 match ip address prefix-list LAB-LOOPBACKS
exit
router bgp 65000
 bgp router-id 10.205.250.1
 bgp bestpath as-path multipath-relax
 neighbor 10.205.200.1 remote-as 65101
 neighbor 10.205.200.1 bfd
 neighbor 10.205.200.5 remote-as 65102
 neighbor 10.205.200.5 bfd
 neighbor 10.205.200.9 remote-as 65103
 neighbor 10.205.200.9 bfd
 neighbor 10.205.200.13 remote-as 65104
 neighbor 10.205.200.13 bfd
 address-family ipv4 unicast
  network 10.205.250.1/32
  maximum-paths 2
  neighbor 10.205.200.1 route-map LAB-LOOPBACKS in
  neighbor 10.205.200.1 route-map LAB-LOOPBACKS out
  neighbor 10.205.200.5 route-map LAB-LOOPBACKS in
  neighbor 10.205.200.5 route-map LAB-LOOPBACKS out
  neighbor 10.205.200.9 route-map LAB-LOOPBACKS in
  neighbor 10.205.200.9 route-map LAB-LOOPBACKS out
  neighbor 10.205.200.13 route-map LAB-LOOPBACKS in
  neighbor 10.205.200.13 route-map LAB-LOOPBACKS out
 exit-address-family
exit
bfd
exit
