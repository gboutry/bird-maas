hostname r2b
frr defaults traditional
service integrated-vtysh-config
ip forwarding
interface lo
 ip address 10.205.250.14/32
exit
interface eth1
 ip address 10.205.200.13/31
exit
interface eth2
 ip address 10.205.200.15/31
exit
ip prefix-list LAB-LOOPBACKS seq 10 permit 10.205.250.0/24 ge 32 le 32
route-map LAB-LOOPBACKS permit 10
 match ip address prefix-list LAB-LOOPBACKS
exit
router bgp 65104
 bgp router-id 10.205.250.14
 bgp bestpath as-path multipath-relax
 neighbor 10.205.200.12 remote-as 65000
 neighbor 10.205.200.12 bfd
 neighbor 10.205.200.14 remote-as 65001
 neighbor 10.205.200.14 bfd
 address-family ipv4 unicast
  network 10.205.250.14/32
  maximum-paths 2
  neighbor 10.205.200.12 route-map LAB-LOOPBACKS in
  neighbor 10.205.200.12 route-map LAB-LOOPBACKS out
  neighbor 10.205.200.14 route-map LAB-LOOPBACKS in
  neighbor 10.205.200.14 route-map LAB-LOOPBACKS out
 exit-address-family
exit
bfd
exit
