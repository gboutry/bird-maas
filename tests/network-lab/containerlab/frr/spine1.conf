hostname spine1
frr defaults traditional
service integrated-vtysh-config
ip forwarding
interface lo
 ip address 10.205.250.2/32
exit
interface eth1
 ip address 10.205.200.2/31
exit
interface eth2
 ip address 10.205.200.6/31
exit
interface eth3
 ip address 10.205.200.10/31
exit
interface eth4
 ip address 10.205.200.14/31
exit
ip prefix-list LAB-LOOPBACKS seq 10 permit 10.205.250.0/24 ge 32 le 32
route-map LAB-LOOPBACKS permit 10
 match ip address prefix-list LAB-LOOPBACKS
exit
router bgp 65001
 bgp router-id 10.205.250.2
 bgp bestpath as-path multipath-relax
 neighbor 10.205.200.3 remote-as 65101
 neighbor 10.205.200.3 bfd
 neighbor 10.205.200.7 remote-as 65102
 neighbor 10.205.200.7 bfd
 neighbor 10.205.200.11 remote-as 65103
 neighbor 10.205.200.11 bfd
 neighbor 10.205.200.15 remote-as 65104
 neighbor 10.205.200.15 bfd
 address-family ipv4 unicast
  network 10.205.250.2/32
  maximum-paths 2
  neighbor 10.205.200.3 route-map LAB-LOOPBACKS in
  neighbor 10.205.200.3 route-map LAB-LOOPBACKS out
  neighbor 10.205.200.7 route-map LAB-LOOPBACKS in
  neighbor 10.205.200.7 route-map LAB-LOOPBACKS out
  neighbor 10.205.200.11 route-map LAB-LOOPBACKS in
  neighbor 10.205.200.11 route-map LAB-LOOPBACKS out
  neighbor 10.205.200.15 route-map LAB-LOOPBACKS in
  neighbor 10.205.200.15 route-map LAB-LOOPBACKS out
 exit-address-family
exit
bfd
exit
