name: maas-bird-fabric-candidate
mgmt:
  network: network-lab-candidate-control
  ipv4-subnet: 10.203.249.0/24
topology:
  nodes:
    spine0:
      kind: linux
      image: network-lab-frr-candidate:10.7.1
      binds:
      - ../frr/daemons:/etc/frr/daemons:ro
      - ../frr/spine0.conf:/etc/frr/frr.conf:ro
      sysctls:
        net.ipv4.ip_forward: '1'
        net.ipv4.conf.all.rp_filter: '0'
        net.ipv6.conf.all.forwarding: '1'
    spine1:
      kind: linux
      image: network-lab-frr-candidate:10.7.1
      binds:
      - ../frr/daemons:/etc/frr/daemons:ro
      - ../frr/spine1.conf:/etc/frr/frr.conf:ro
      sysctls:
        net.ipv4.ip_forward: '1'
        net.ipv4.conf.all.rp_filter: '0'
        net.ipv6.conf.all.forwarding: '1'
    r1a:
      kind: linux
      image: network-lab-frr-candidate:10.7.1
      binds:
      - ../frr/daemons:/etc/frr/daemons:ro
      - ../frr/r1a.conf:/etc/frr/frr.conf:ro
      sysctls:
        net.ipv4.ip_forward: '1'
        net.ipv4.conf.all.rp_filter: '0'
        net.ipv6.conf.all.forwarding: '1'
    r1b:
      kind: linux
      image: network-lab-frr-candidate:10.7.1
      binds:
      - ../frr/daemons:/etc/frr/daemons:ro
      - ../frr/r1b.conf:/etc/frr/frr.conf:ro
      sysctls:
        net.ipv4.ip_forward: '1'
        net.ipv4.conf.all.rp_filter: '0'
        net.ipv6.conf.all.forwarding: '1'
    r2a:
      kind: linux
      image: network-lab-frr-candidate:10.7.1
      binds:
      - ../frr/daemons:/etc/frr/daemons:ro
      - ../frr/r2a.conf:/etc/frr/frr.conf:ro
      sysctls:
        net.ipv4.ip_forward: '1'
        net.ipv4.conf.all.rp_filter: '0'
        net.ipv6.conf.all.forwarding: '1'
    r2b:
      kind: linux
      image: network-lab-frr-candidate:10.7.1
      binds:
      - ../frr/daemons:/etc/frr/daemons:ro
      - ../frr/r2b.conf:/etc/frr/frr.conf:ro
      sysctls:
        net.ipv4.ip_forward: '1'
        net.ipv4.conf.all.rp_filter: '0'
        net.ipv6.conf.all.forwarding: '1'
  links:
  - endpoints:
    - r1a:eth1
    - spine0:eth1
  - endpoints:
    - r1a:eth2
    - spine1:eth1
  - endpoints:
    - r1b:eth1
    - spine0:eth2
  - endpoints:
    - r1b:eth2
    - spine1:eth2
  - endpoints:
    - r2a:eth1
    - spine0:eth3
  - endpoints:
    - r2a:eth2
    - spine1:eth3
  - endpoints:
    - r2b:eth1
    - spine0:eth4
  - endpoints:
    - r2b:eth2
    - spine1:eth4
