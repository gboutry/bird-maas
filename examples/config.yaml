maas-inventory:
  maas-url: https://maas.example/MAAS/
  # Grant a Juju secret containing api-key; never put the credential in this file.
  maas-credentials: secret:replace-with-granted-secret
  rack-profiles: |
    [
      {"id":"a","peers":[
        {"id":"a-tor1","chassis_id":"00:00:00:00:a1:01","asn":65011},
        {"id":"a-tor2","chassis_id":"00:00:00:00:a1:02","asn":65012}
      ]},
      {"id":"b","peers":[
        {"id":"b-tor1","chassis_id":"00:00:00:00:b1:01","asn":65021},
        {"id":"b-tor2","chassis_id":"00:00:00:00:b1:02","asn":65022}
      ]}
    ]
  # Machine tags must include exactly one matching rack-a/rack-b tag.
  host-identities: |
    [
      {"machine_id":"abc123","local_asn":4200001011,"router_id":"10.255.11.11"},
      {"machine_id":"def456","local_asn":4200002011,"router_id":"10.255.12.11"}
    ]
bird:
  enabled: false
  routing-domain: storage-public
  kernel-table: 3100
  import-prefixes: 10.60.11.0/24,10.60.12.0/24
  export-allowlist: 10.60.11.0/24,10.60.12.0/24
  bgp-credentials: secret:replace-with-granted-session-secrets
  bfd-min-tx-ms: 300
  bfd-min-rx-ms: 300
  bfd-multiplier: 3
