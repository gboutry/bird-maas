type: charm
base: ubuntu@24.04
platforms:
  amd64:
    build-on:
    - amd64
    build-for:
    - amd64
  arm64:
    build-on:
    - arm64
    build-for:
    - arm64
assumes:
- juju >= 3.6
parts:
  charm:
    plugin: uv
    source: ../..
    source-subdir: charms/bird
    build-snaps:
    - astral-uv
name: bird
title: Bird
summary: Manage unnumbered host BGP and BFD with validated attachment inventory.
description: Principal machine charm owning host BIRD routing domains and explicit source-policy
  guards. Does not provision interfaces, addresses or TORs.
requires:
  inventory:
    interface: machine-inventory
    limit: 1
    optional: false
  attachments:
    interface: host-attachments
    optional: false
  advertisements:
    interface: route-advertisements
    optional: true
config:
  options:
    rack:
      type: string
      default: ''
      description: Physical rack ID. Deploy a separate application for each rack.
    enabled:
      type: boolean
      description: Explicitly enable package installation and owned routing service.
      default: false
    advertisement-mode:
      type: string
      default: workload
      description: >-
        Origin authority: workload requires route-advertisements publishers;
        node-addresses explicitly authorizes configured node-owned /32s after
        native loopback address and persistent source-policy validation.
        Node mode does not check Ceph, API or OVN service health.
    bgp-credentials:
      type: string
      description: Juju secret ID containing session-id to BGP password entries.
      default: ''
    bfd-min-tx-ms:
      type: int
      description: Desired BFD transmit interval, 50..60000 milliseconds.
      default: 300
    bfd-min-rx-ms:
      type: int
      description: Minimum accepted BFD receive interval, 50..60000 milliseconds.
      default: 300
    bfd-multiplier:
      type: int
      description: BFD detection multiplier, 1..255.
      default: 3
    bgp-hold-time-seconds:
      type: int
      description: BGP hold time in seconds.
      default: 9
    bgp-keepalive-time-seconds:
      type: int
      description: BGP keepalive interval in seconds.
      default: 3
    protected-prefixes:
      type: string
      default: ''
      description: Management IPv4 prefixes that no routing domain may import. Managed source VIPs
        never fall back to the main table; ordinary management sources retain their existing routes.
    routing-domains:
      type: string
      default: '[]'
      description: JSON array of routing domains with approved imports/exports and per-host NUMA
        contexts. Static source-wide rules and guards must be provisioned by the host network owner.
        This is the only supported routing model.
    local-ovs-ports:
      type: string
      default: '[]'
      description: >-
        Explicit local OVS internal-interface selectors (serial, bridge, port,
        physical uplink and optional uplink_bond). Only for BIRD sharing the
        OVS kernel, normally on the DPU. Empty never invokes OVS discovery.
    policy-protocol:
      type: int
      default: 196
      description: >-
        Exact protocol tag of externally provisioned source rules and unreachable
        guards: 196 for explicit provisioning, or 4 for Netplan/networkd static
        objects. Does not adopt or rewrite objects. Changing the tag requires an
        explicit static-policy migration before activation.
actions:
  inspect:
    description: Show the accepted routing plan without credentials or full daemon configuration.
  plan:
    description: Validate and show proposed host routing intent without applying it.
  reconcile:
    description: Reconcile the current authoritative rack and host inputs.
  decommission:
    description: Remove only this unit's BIRD service, retaining externally owned network policy.
    params:
      confirm:
        type: boolean
        default: false
    required:
    - confirm
